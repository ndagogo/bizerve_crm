{% extends 'base.html' %}

{% block title %}Delete Task - 2c2d Solutions{% endblock %}
{% block page_title %}Delete Task{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card dashboard-card">
            <div class="card-body p-4">
                <h4 class="mb-2" style="font-weight:700;">Delete this task?</h4>
                <p class="text-muted">You are about to permanently delete <strong>{{ task.title }}</strong>. This cannot be undone.</p>
                <form method="post" class="d-flex gap-2 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete Task</button>
                    <a href="{% url 'tasks:task_detail' task.id %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
