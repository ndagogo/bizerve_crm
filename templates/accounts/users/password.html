{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set password - 2c2d Solutions{% endblock %}
{% block page_title %}Set password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card dashboard-card">
            <div class="card-header">
                <h5 class="card-title mb-0">Password for {{ managed_user.username }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Update password</button>
                        <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
