{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit {{ method.name }} - 2c2d Solutions{% endblock %}
{% block page_title %}Edit Withdrawal Method{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card dashboard-card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'wallet:admin_withdrawal_methods' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
